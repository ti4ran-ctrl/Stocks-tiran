            { s: 'ESLT', m: 'IL', n: 'אלביט מערכות' }, { s: 'NICE', m: 'IL', n: 'נייס' },
            { s: 'TEVA', m: 'IL', n: 'טבע' }, { s: 'MNDY', m: 'IL', n: 'מאנדיי' },
            { s: 'AMZN', m: 'US', n: 'Amazon' }, { s: 'META', m: 'US', n: 'Meta' },
            { s: 'SMCI', m: 'US', n: 'Super Micro' }, { s: 'CELH', m: 'US', n: 'Celsius' },
            { s: 'ICL', m: 'IL', n: 'איי.סי.אל' }, { s: 'TSEM', m: 'IL', n: 'טאואר' },
            { s: 'WIX', m: 'IL', n: 'Wix.com' }, { s: 'RIVN', m: 'US', n: 'Rivian' },
            { s: 'DKNG', m: 'US', n: 'DraftKings' }, { s: 'SOFI', m: 'US', n: 'SoFi' },
            { s: 'LEUMI', m: 'IL', n: 'בנק לאומי' }, { s: 'HAPO', m: 'IL', n: 'בנק הפועלים' }
        ];

        let scanResults = [];
        let activeIndex = 0;

        async function startScan() {
            document.getElementById('idleState').classList.add('hidden');
            document.getElementById('resultState').classList.add('hidden');
            const loading = document.getElementById('loadingState');
            loading.classList.remove('hidden');
            
            const stepsDiv = document.getElementById('steps');
            const loadingText = document.getElementById('loadingText');
            stepsDiv.innerHTML = '';
            
            const steps = ["סריקת מניות Small-cap ו-Blue-chip", "ניתוח נרות ותבניות", "בדיקת מתנדים ומומנטום", "חישוב כניסה חכמה (SOP)", "ניהול סיכונים סופי"];
            
            scanResults = [];
            const shuffled = [...STOCK_POOL].sort(() => 0.5 - Math.random());

            for(let i = 0; i < steps.length; i++) {
                loadingText.innerText = `מנתח: ${shuffled[i % shuffled.length].s}...`;
                stepsDiv.innerHTML += `<div class="flex items-center gap-3 text-xs font-bold text-slate-400 animate-in fade-in slide-in-from-right duration-500">
                    <div class="w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.5)]"></div> ${steps[i]}
                </div>`;
                await new Promise(r => setTimeout(r, 700));
            }

            for(let i=0; i<3; i++) {
                const stock = shuffled[i];
                const price = (Math.random() * 500 + 10).toFixed(2);
                const score = (8.2 + Math.random() * 1.6).toFixed(1);
                const isBuy = score >= 8.7;
                const entry = (price * 1.008).toFixed(2);

                let summary = isBuy

                    : "המניה מדשדשת מתחת לרמת התנגדות. לא זוהה אישור כניסה בטוח לפי SOP.";

                scanResults.push({
                    symbol: stock.s,
                    name: stock.n,
                    market: stock.m,
                    price: price,
                    score: score,
                    isBuy: isBuy,
                    entry: entry,
                    target: (entry * (1 + (profitPct / 100))).toFixed(2),
                    stop: (entry * 0.945).toFixed(2),
                    profitPct: profitPct,
                    summary: summary
                });
            }

            renderResults();
        }

        function renderResults() {
            document.getElementById('loadingState').classList.add('hidden');
            const resArea = document.getElementById('resultState');
            resArea.classList.remove('hidden');

            const current = scanResults[activeIndex];
            
            resArea.innerHTML = `

                    ${scanResults.map((r, i) => `

                            </span>

                        </div>
                        <p class="text-[10px] text-slate-500 font-bold">${current.name}</p>
                    </div>
                    <div class="text-left font-mono">
                        <div class="text-2xl font-black">$${current.price}</div>
                        <div class="text-[10px] text-emerald-400 font-bold">+1.24%</div>
                    </div>
                </div>

                <div class="p-4 rounded-2xl border text-center font-black transition-all ${current.isBuy ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.1)]' : 'bg-rose-500/10 border-rose-500/40 text-rose-400'}">
                    <div class="text-sm mb-1 uppercase tracking-widest">${current.isBuy ? 'קנייה - אישור כניסה' : 'המתנה - לא למסחר'}</div>
                    <div class="text-[10px] opacity-70">ציון AI סופי: ${current.score} / 10</div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-2 rounded-xl text-center border border-white/5">
                        <div class="text-[8px] text-slate-500 uppercase font-bold mb-1">כניסה SOP</div>
                        <div class="text-xs font-bold font-mono text-white">$${current.entry}</div>
                    </div>
                    <div class="bg-emerald-500/5 p-2 rounded-xl text-center border border-emerald-500/20">
                        <div class="text-[8px] text-emerald-500 uppercase font-bold mb-1">יעד (+${current.profitPct}%)</div>
                        <div class="text-xs font-bold font-mono text-emerald-400">$${current.target}</div>
                    </div>
                    <div class="bg-rose-500/5 p-2 rounded-xl text-center border border-rose-500/20">
                        <div class="text-[8px] text-rose-500 uppercase font-bold mb-1">סטופ (SL)</div>
                        <div class="text-xs font-bold font-mono text-rose-400">$${current.stop}</div>
                    </div>
                </div>

                <div class="bg-slate-900/40 p-4 rounded-2xl border border-white/5 space-y-3">
                    <h4 class="text-[10px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> סיכום המלצה חכם
                    </h4>
                    <p class="text-xs text-slate-300 leading-relaxed font-bold italic">
                        "${current.summary}"
                    </p>
                    <div class="flex flex-col gap-2 pt-2 border-t border-white/5">
                        <div class="flex gap-2 text-[10px] text-slate-400 justify-end items-center">

                        </div>

                            <i data-lucide="target" class="w-3 h-3 text-emerald-400"></i>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function setActive(idx) {
            activeIndex = idx;
            renderResults();
        }

        function manualSearch() {
            const sym = document.getElementById('symbolInput').value.toUpperCase();
            if(sym) startScan();
        }
